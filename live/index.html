<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>AlphaTrader Live</title>
<style>
  :root { --bg:#0b0e14; --card:#141a26; --line:#232c40; --txt:#e8edf6; --dim:#8b96ad;
          --long:#22c55e; --short:#ef4444; --amber:#f59e0b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         min-height:100vh; padding:20px 16px 40px; max-width:640px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
  h1 { font-size:20px; letter-spacing:.5px; }
  h1 span { color:var(--amber); }
  #updated { font-size:12px; color:var(--dim); }
  .banner { border-radius:14px; padding:18px; margin-bottom:14px; border:1px solid var(--line); background:var(--card); }
  .banner.open-long { border-color:var(--long); animation:pulseL 2s infinite; }
  .banner.open-short { border-color:var(--short); animation:pulseS 2s infinite; }
  @keyframes pulseL { 0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.35)} 50%{box-shadow:0 0 0 8px rgba(34,197,94,0)} }
  @keyframes pulseS { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.35)} 50%{box-shadow:0 0 0 8px rgba(239,68,68,0)} }
  .status { font-size:13px; font-weight:700; letter-spacing:1px; margin-bottom:8px; }
  .open-long .status { color:var(--long); } .open-short .status { color:var(--short); }
  .sym { font-size:26px; font-weight:800; }
  .dir { font-size:15px; font-weight:700; margin-left:8px; }
  .dir.long { color:var(--long); } .dir.short { color:var(--short); }
  .called { font-size:12px; color:var(--dim); margin-top:6px; }
  .called strong { color:var(--txt); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .cell { background:#0e1420; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .cell .k { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; }
  .cell .v { font-size:17px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
  .why { font-size:13px; color:var(--dim); margin-top:12px; line-height:1.45; }
  .tags { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag { font-size:11px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--dim); }
  .tag.htf { color:var(--long); border-color:var(--long); }
  .tag.aplus { color:var(--amber); border-color:var(--amber); }
  iframe.chart { width:100%; height:400px; border:0; border-radius:10px; margin-top:12px; background:#0e1420; }
  .chart-label { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.8px; margin:14px 0 2px; }
  .compact { padding:14px 16px; }
  .compact .sym { font-size:19px; }
  .compact .grid { margin-top:10px; }
  .compact .cell .v { font-size:14px; }
  .section-title { font-size:13px; font-weight:700; letter-spacing:1px; color:var(--dim); margin:18px 0 10px; text-transform:uppercase; }
  .quiet { text-align:center; padding:34px 18px; }
  .quiet .big { font-size:18px; font-weight:700; margin-bottom:6px; }
  .quiet .sub { font-size:13px; color:var(--dim); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--long); margin-right:7px; animation:blink 2.4s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
  .score { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:4px; }
  .score .cell .v { font-size:16px; }
  .neg { color:var(--short); } .pos { color:var(--long); }
  #err { display:none; text-align:center; color:var(--amber); font-size:13px; padding:20px; }
  footer { text-align:center; font-size:11px; color:var(--dim); margin-top:22px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1>AlphaTrader <span>Live</span></h1>
  <div id="updated">connecting…</div>
</header>
<div id="err">Couldn’t reach the data feed — retrying…</div>
<div id="signals"></div>
<div class="score" id="score"></div>
<footer>Reference view — quotes may differ from your broker feed.<br/>Market scenarios are informational, not financial advice.</footer>
<script>
const REFRESH_MS = 60000;
const TV_SYMBOL = { XAUUSD:'OANDA:XAUUSD', BTCUSD:'BITSTAMP:BTCUSD', EURUSD:'OANDA:EURUSD', DXY:'TVC:DXY', NAS100:'TVC:NDQ' };
const TV_INTERVAL = { M15:'15', M30:'30', H1:'60' };
const fmtT = iso => { try { return new Date(iso).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } };
const ago = iso => { const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  if (s < 60) return s + 's ago'; const m = Math.round(s/60); return m + 'm ago'; };
const tvChart = s => {
  const sym = encodeURIComponent(TV_SYMBOL[s.symbol] || s.symbol);
  const iv = TV_INTERVAL[s.timeframe] || '15';
  return `<div class="chart-label">Live chart — ${s.symbol} ${s.timeframe || ''}</div>
  <iframe class="chart" src="https://www.tradingview.com/widgetembed/?symbol=${sym}&interval=${iv}&theme=dark&style=1&locale=en&hide_side_toolbar=false&allow_symbol_change=false&withdateranges=1" allowfullscreen loading="lazy"></iframe>`;
};
const tags = s => `<div class="tags">
    ${s.timeframe ? `<span class="tag">${s.timeframe}</span>` : ''}
    ${s.confluenceScore >= 5 ? `<span class="tag aplus">🔥 A+ ${s.confluenceScore}/6</span>` : ''}
    ${s.htfAligned ? '<span class="tag htf">HTF ✓</span>' : ''}
    <span class="tag">${s.source === 'human' ? 'human' : 'AI'}</span>
  </div>`;

function renderSignal(s, featured) {
  const long = s.side === 'long';
  return `<div class="banner ${long ? 'open-long' : 'open-short'}${featured ? '' : ' compact'}">
    <div class="status">${long ? '▲' : '▼'} TRADE OPEN${featured ? ' — LATEST SIGNAL' : ''}</div>
    <div><span class="sym">${s.symbol}</span><span class="dir ${s.side}">${s.side.toUpperCase()}</span></div>
    <div class="called">Called <strong>${fmtT(s.openedAt)}</strong>${s.sourceAsOf ? ` · ${s.sourceAsOf}` : ''}</div>
    <div class="grid">
      <div class="cell"><div class="k">Entry</div><div class="v">${s.entry}</div></div>
      <div class="cell"><div class="k">Stop</div><div class="v">${s.stop}</div></div>
      <div class="cell"><div class="k">TP1 (1R)</div><div class="v">${s.tp1}</div></div>
      <div class="cell"><div class="k">TP2 (2R)</div><div class="v">${s.tp2}</div></div>
    </div>
    ${s.rationale ? `<div class="why">${s.rationale}</div>` : ''}
    ${tags(s)}
    ${featured ? tvChart(s) : ''}
  </div>`;
}

function render(d) {
  document.getElementById('err').style.display = 'none';
  document.getElementById('updated').textContent = 'updated ' + ago(d.updatedAt);
  const open = (d.openSignals || []).slice().sort((a,b) => new Date(b.openedAt) - new Date(a.openedAt));
  let html = '';
  if (open.length) {
    html += renderSignal(open[0], true);
    if (open.length > 1) {
      html += `<div class="section-title">Also open (${open.length - 1})</div>`;
      html += open.slice(1).map(s => renderSignal(s, false)).join('');
    }
  } else {
    html = `<div class="banner quiet"><div class="big"><span class="dot"></span>On watch</div>
       <div class="sub">No open trades right now.<br/>You’ll get a chat alert the moment one confirms.</div></div>`;
  }
  document.getElementById('signals').innerHTML = html;
  const sc = d.scorecard || {};
  const wr = sc.winRate == null ? '—' : (sc.winRate.toFixed ? sc.winRate.toFixed(0) + '%' : sc.winRate);
  const avg = sc.averageR == null ? '—' : ((sc.averageR > 0 ? '+' : '') + Number(sc.averageR).toFixed(1) + 'R');
  const tot = sc.totalR == null ? '—' : ((sc.totalR > 0 ? '+' : '') + Number(sc.totalR).toFixed(1) + 'R');
  const cls = v => v == null ? '' : (Number(v) > 0 ? 'pos' : (Number(v) < 0 ? 'neg' : ''));
  document.getElementById('score').innerHTML = `
    <div class="cell"><div class="k">Graded</div><div class="v">${sc.graded ?? '—'}</div></div>
    <div class="cell"><div class="k">Win rate</div><div class="v">${wr}</div></div>
    <div class="cell"><div class="k">Avg R</div><div class="v ${cls(sc.averageR)}">${avg}</div></div>
    <div class="cell"><div class="k">Total R</div><div class="v ${cls(sc.totalR)}">${tot}</div></div>`;
  document.title = open.length ? `(${open.length}) TRADE OPEN — AlphaTrader Live` : 'AlphaTrader Live';
}

async function load() {
  try {
    const r = await fetch('signals.json', { cache: 'no-store' });
    if (!r.ok) throw 0;
    render(await r.json());
  } catch (e) {
    document.getElementById('err').style.display = 'block';
  }
}
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
